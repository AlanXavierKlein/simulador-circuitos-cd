<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="940" viewBox="0 0 1680 940">
<defs>
  <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#12304a" stroke-width="1.5"/></pattern>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <marker id="arrow" markerWidth="18" markerHeight="22" refX="16" refY="11" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L18 11L0 22Z" fill="#f4f7ff"/></marker>
  <style>
    .wire{fill:none;stroke:#00e6f2;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
    .res{fill:none;stroke:#ffc928;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;filter:url(#glow)}
    .node{fill:#00e6f2}
    .label{font:600 30px 'Segoe UI',Arial,sans-serif;fill:#f4f7ff;text-anchor:middle}
    .current{font:600 30px 'Segoe UI',Arial,sans-serif;fill:#f4f7ff;text-anchor:middle}
  </style>
</defs>
<rect width="1680" height="940" fill="#06172b"/><rect width="1680" height="940" fill="url(#grid)"/>
<!-- Rectangular network: input current enters the upper-left corner; output leaves the lower-right corner. -->
<path class="wire" d="M430 350V650H620"/>
<path class="wire" d="M430 350H620"/><path class="res" d="M620 350l14-20 14 40 14-40 14 40 14-40 14 40 14-20"/><path class="wire" d="M718 350H1110V425"/>
<text class="label" x="669" y="280">R1 · 6 Ω</text>
<path class="res" d="M1110 425l-18 14 36 14-36 14 36 14-36 14 36 14-18 14"/><path class="wire" d="M1110 523V650H820"/>
<text class="label" x="1228" y="490">R2 · 10 Ω</text>
<path class="res" d="M820 650l-14-20-14 40-14-40-14 40-14-40-14 40-14-20"/><path class="wire" d="M722 650H430"/>
<text class="label" x="771" y="730">R3 · 9 Ω</text>
<!-- Current arrows protrude clearly from the leads, as in the source. -->
<path class="wire" d="M170 350H430"/><path d="M245 350H340" fill="none" stroke="#f4f7ff" stroke-width="5" marker-end="url(#arrow)"/>
<text class="current" x="300" y="420">Iₑ = 1 A</text>
<circle class="node" cx="430" cy="350" r="10"/>
<path class="wire" d="M1110 650H1510"/><path d="M1370 650H1470" fill="none" stroke="#f4f7ff" stroke-width="5" marker-end="url(#arrow)"/>
<text class="current" x="1355" y="725">Iₛ = 0.25 A</text>
<circle class="node" cx="1110" cy="650" r="10"/>
</svg>
